<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#1f5c34">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <title>Ceba Purio</title>
    <style>
        :root {
            --g: #1f5c34;
            --gl: #e3ede4;
            --bg: #f1f4ee;
            --tx: #14231a;
            --mu: #4f5f54;
            --am: #f2c230;
            --ok: #1b6e2e;
            --wa: #8a5a00;
            --er: #a8231b;
            --bd: #c9d4cb
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 18px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--tx)
        }

        #app {
            padding: 16px 16px 104px;
            max-width: 820px;
            margin: auto
        }

        h1 {
            font-size: 28px;
            margin: 8px 0 4px
        }

        h2 {
            font-size: 20px;
            margin: 24px 0 8px
        }

        .mu {
            color: var(--mu);
            margin: 0 0 12px
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            background: var(--g);
            padding-bottom: env(safe-area-inset-bottom)
        }

        nav button {
            flex: 1;
            min-height: 64px;
            border: 0;
            background: none;
            color: #cfe2d3;
            font: inherit;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px
        }

        nav button span {
            font-size: 22px
        }

        nav button.on {
            color: #fff;
            font-weight: 700;
            box-shadow: inset 0 4px 0 var(--am)
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline: 3px solid var(--am);
            outline-offset: 2px
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px
        }

        .card {
            background: #fff;
            border: 2px solid var(--bd);
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            color: var(--mu)
        }

        .card b {
            display: block;
            font-size: 30px;
            color: var(--tx)
        }

        .al {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
            border-left: 8px solid;
            background: #fff
        }

        .al.ok {
            border-color: var(--ok);
            color: var(--ok)
        }

        .al.wa {
            border-color: var(--wa);
            color: #3d2900
        }

        .al.er {
            border-color: var(--er);
            color: var(--er)
        }

        .big {
            width: 100%;
            min-height: 64px;
            margin-top: 16px;
            border: 0;
            border-radius: 10px;
            background: var(--am);
            color: #2a2000;
            font-weight: 700;
            font-size: 20px;
            font-family: inherit
        }

        .sm {
            min-height: 44px;
            padding: 0 16px;
            border: 2px solid var(--g);
            border-radius: 8px;
            background: #fff;
            color: var(--g);
            font-weight: 700;
            font-size: 16px;
            font-family: inherit
        }

        label {
            display: block;
            margin: 14px 0 0;
            font-weight: 600
        }

        input,
        textarea,
        select {
            display: block;
            width: 100%;
            min-height: 52px;
            margin-top: 6px;
            padding: 0 12px;
            font: inherit;
            border: 2px solid #7d8f82;
            border-radius: 8px;
            background: #fff
        }

        .tabs {
            display: flex;
            margin: 12px 0
        }

        .tabs button {
            flex: 1;
            min-height: 52px;
            border: 2px solid var(--g);
            background: #fff;
            color: var(--g);
            font-weight: 700;
            font-size: 17px;
            font-family: inherit
        }

        .tabs button:first-child {
            border-radius: 8px 0 0 8px
        }

        .tabs button:last-child {
            border-radius: 0 8px 8px 0
        }

        .tabs button.on {
            background: var(--g);
            color: #fff
        }

        .lote {
            background: #fff;
            border: 2px solid var(--bd);
            border-radius: 10px;
            padding: 12px;
            margin: 8px 0
        }

        .lote b {
            font-size: 20px
        }

        .lote div {
            color: var(--mu)
        }

        .tw {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            font-size: 16px
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid var(--bd);
            text-align: left
        }

        th {
            background: var(--gl)
        }

        #t {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: 88px;
            padding: 14px;
            border-radius: 8px;
            background: var(--tx);
            color: #fff;
            text-align: center;
            z-index: 9
        }

        #t.e {
            background: var(--er)
        }

        .net {
            font-size: 13px;
            color: var(--mu)
        }

        @media(min-width:900px) {
            body {
                padding-left: 200px
            }

            nav {
                top: 0;
                bottom: 0;
                right: auto;
                width: 200px;
                flex-direction: column;
                justify-content: flex-start;
                padding-top: 24px
            }

            nav button {
                flex: none;
                flex-direction: row;
                justify-content: flex-start;
                gap: 12px;
                padding: 0 20px;
                font-size: 17px
            }

            nav button.on {
                box-shadow: inset 4px 0 0 var(--am)
            }

            #app {
                padding-bottom: 40px
            }
        }
    </style>
</head>

<body>

    <div id="login"
        style="position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px">
        <div style="width:100%;max-width:380px">
            <img src="icon-192.png" alt="" style="width:96px;display:block;margin:0 auto 12px;border-radius:20px">
            <h1 style="text-align:center">Control de la ganadera de Purio</h1>
            <p id="lcarga" class="mu" style="text-align:center">Cargando…</p>
            <form id="lform" hidden onsubmit="return entrar(event)">
                <label>Correo<input id="lc" type="email" autocomplete="username" required></label>
                <label>Contraseña<input id="lp" type="password" autocomplete="current-password" required></label>
                <p id="lerr" style="color:var(--er);min-height:1.4em"></p>
                <button class="big">Entrar</button>
            </form>
        </div>
    </div>


    <main id="app"></main>
    <nav><button data-v="inicio" onclick="go('inicio')"><span>🏠</span>Inicio</button><button data-v="registrar"
            onclick="go('registrar')"><span>✏️</span>Registrar</button><button data-v="inventario"
            onclick="go('inventario')"><span>🐄</span>Inventario</button><button data-v="costos"
            onclick="go('costos')"><span>💲</span>Costos</button><button data-v="reportes"
            onclick="go('reportes')"><span>📊</span>Reportes</button></nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8jJhs7Yy_A6hEyIt4h0311Pan4q8GE0A",
            authDomain: "ceba-purio.firebaseapp.com",
            projectId: "ceba-purio",
            storageBucket: "ceba-purio.firebasestorage.app",
            messagingSenderId: "11785256090",
            appId: "1:11785256090:web:f6d9e6eb2fd854bd53b323",
            measurementId: "G-3CD7NW5YBG"
        };

        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
        });
        const auth = getAuth(app);
        console.log ('1: auth listo');
        const ref = doc(db, 'empresas', 'principal');
        const base = { lotes: [], ali: [], pes: [], stock: [], formulas: [], conc: {}, cc: {}, elab: [], fases: [], compras: [] };
        const DATA_V = 2;
        let bloqueado = false;

      let escuchando = null;

window.subir = () => {
    if (bloqueado || !auth.currentUser) return;
    setDoc(ref, JSON.parse(JSON.stringify({ ...S, v: DATA_V }))).catch(err => console.error('Error al subir:', err));
};

function escuchar() {
    return onSnapshot(ref, snap => {
        if (!snap.exists()) {
            if (!snap.metadata.fromCache) window.subir();
            return
        }
        if (snap.metadata.hasPendingWrites) return;
        const d = snap.data();
        if ((d.v || 1) > DATA_V) { bloqueado = true; toast('Hay una versión nueva de la app: recarga la página', 1); return }
        bloqueado = false;
        S = { ...JSON.parse(JSON.stringify(base)), ...d, v: DATA_V };
        localStorage.setItem(K, JSON.stringify(S));
        const a = document.activeElement;
        if (!a || !['INPUT', 'SELECT'].includes(a.tagName)) render();
    }, err => console.error('Error de sincronización:', err));
}

onAuthStateChanged(auth, user => {
    console.log('2: sesión: ', user ? user.email : 'ninguna');
    if (escuchando) { escuchando(); escuchando = null }
    if (user) {
        $('#login').style.display = 'none';
        escuchando = escuchar();
    } else {
        $('#login').style.display = 'flex';
        $('#lcarga').hidden = true;
        $('#lform').hidden = false;
    }
});

window.entrar = async e => {
    e.preventDefault();
    $('#lerr').textContent = '';
    try { await signInWithEmailAndPassword(auth, $('#lc').value.trim(), $('#lp').value) }
    catch (err) { $('#lerr').textContent = 'Correo o contraseña incorrectos' }
    return false
};

window.salir = async () => {
    await signOut(auth);
    localStorage.removeItem(K);
    S = JSON.parse(JSON.stringify(base));
    render();
}; 

    </script>
    <script>
        const K = 'cebacontrol_v1', vacioS = () => ({ lotes: [], ali: [], pes: [], stock: [], conc: {}, cc: {}, elab: [], fases: [], compras: [], formulas: [1, 2, 3, 4].map(i => ({ id: 'f' + i, n: 'Fórmula ' + i, ing: [] })) }); let S = { ...vacioS(), ...JSON.parse(localStorage.getItem(K) || '{}') };
        const save = () => { localStorage.setItem(K, JSON.stringify(S)); if (window.subir) window.subir() }, $ = s => document.querySelector(s), uid = () => Math.random().toString(36).slice(2, 9);
        const hoy = () => new Date().toLocaleDateString('sv'), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const SACO = 60;
        const fdv = (id = 'fdt') => $('#' + id)?.value || hoy();
        const fdIn = (id = 'fdt') => { const v = fdSel || hoy(); return `<label>Fecha del registro<input id=${id} type=date value="${v}" max="${hoy()}" onchange="fdSel=this.value;render()"></label>${v != hoy() ? '<p class=mu style="color:#b3261e">⚠ Estás registrando con una fecha pasada. Registra en orden, de la más antigua a la más reciente.</p>' : ''}` };
        const ens = lb => { const n = Math.floor(lb / SACO), r = +(lb - n * SACO).toFixed(1); return n + (n == 1 ? ' saco' : ' sacos') + (r ? ' + ' + r + ' lb' : '') };
        let view = 'inicio', tab = 'ali', filtro = '', pre = '', cambio = '', editF = '', cf = '', cd = 14, fdSel = '', accL = '', accT = '';
        const MON = 'B/.', mo = n => MON + ' ' + (+n || 0).toFixed(2);
        const go = (v, t) => { const nuevo = view != v || (t && t != tab); view = v; if (t) tab = t; render(); if (nuevo) scrollTo(0, 0) };
        function toast(m, e) { const d = document.createElement('div'); d.id = 't'; d.textContent = m; if (e) d.className = 'e'; document.body.append(d); setTimeout(() => d.remove(), 2600) }
        const act = () => S.lotes.filter(l => l.c > 0);
        const opL = (s, todos) => (todos ? S.lotes : act()).map(l => `<option value="${l.id}"${l.id == s ? ' selected' : ''}>${esc(l.n)}</option>`).join('');
        const pesL = id => S.pes.filter(p => p.l == id).sort((a, b) => a.f < b.f ? -1 : 1);
        function gdp(id) { const a = pesL(id); if (a.length < 2) return null; const x = a.at(-2), y = a.at(-1), d = (new Date(y.f) - new Date(x.f)) / 864e5; return d > 0 ? (y.p - x.p) / d : null }
        const vacio = () => `<div class="al wa">Aún no hay lotes. Crea el primero en Inventario.</div>`;
        const V = {
            inicio() {
                const h = hoy(), hoyA = S.ali.filter(a => a.f == h), hecho = new Set(hoyA.map(a => a.l)), pend = act().filter(l => !hecho.has(l.id)), bajo = S.stock.filter(x => x.tk ? (x.tn || 0) <= x.min : (!x.est && x.k < x.min));
                return `<h1>Resumen de hoy</h1><p class=mu>${new Date().toLocaleDateString('es-PA', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
<div class=cards><div class=card><b>${act().length}</b>lotes</div><div class=card><b>${hoyA.reduce((s, a) => s + a.k, 0)}</b>lb dados hoy</div><div class=card><b>${S.stock.filter(x => !x.cnt && !x.tk).reduce((s, x) => s + x.k, 0)}</b>lb en bodega</div></div>
<h2>Tareas del día</h2>${!S.lotes.length ? vacio() : pend.length ? pend.map(l => `<div class="al wa"><span>⚠ Falta alimentación: <b>${esc(l.n)}</b></span><button class=sm onclick="pre='${l.id}';go('registrar','ali')">Registrar</button></div>`).join('') : '<div class="al ok">✔ Alimentación de hoy al día</div>'}
${bajo.map(x => `<div class="al er"><span>⛔ Poco alimento: <b>${esc(x.n)}</b> (${uCant(x, x.k)})</span></div>`).join('')}
<button class=big onclick="go('registrar','ali')">Registrar alimentación</button><p class=net>${navigator.onLine ? 'En línea' : 'Sin conexión: los datos se guardan en este dispositivo'}</p> <p><button class=sm onclick="salir()">Cerrar sesión</button></p>`
            },
            registrar() {
                if (!act().length) return '<h1>Registrar</h1>' + vacio();
                const t = `<h1>Registrar</h1><div class=tabs><button class="${tab == 'ali' ? 'on' : ''}" onclick="go('registrar','ali')">Alimentación</button><button class="${tab == 'pes' ? 'on' : ''}" onclick="go('registrar','pes')">Pesaje</button><button class="${tab == 'ela' ? 'on' : ''}" onclick="go('registrar','ela')">Producción</button></div>`;
                if (tab == 'ela') return t + `<form onsubmit="return fEla(event)">${fdIn()}<label>Fórmula<select id=fo onchange="armar()">${S.formulas.map(f => `<option value="${f.id}">${esc(f.n)}</option>`).join('')}</select></label><label>Barcadas del día<input id=nb type=number inputmode=numeric min=1 step=1 value=5 oninput="armar()"></label><h2>Insumos usados (lb)</h2><div id=ins></div><h2>Producción</h2><label>Sacos que salieron (60 lb c/u)<input id=sc type=number inputmode=numeric step=1 min=0 required></label><label>Sobra sin ensacar (lb)<input id=sb type=number inputmode=decimal step=any min=0 value=0></label><button class=big>Guardar producción</button></form>`;
                if (tab == 'ali') return t + (S.formulas.length ? `<form onsubmit="return fAli(event)">${fdIn()}<label>Lote<select id=l onchange="$('#a').value=S.lotes.find(x=>x.id==this.value).fo||S.formulas[0].id">${opL(pre)}</select></label><label>Concentrado<select id=a>${S.formulas.map(f => `<option value="${f.id}"${f.id == (S.lotes.find(l => l.id == (pre || S.lotes[0].id)) || {}).fo ? ' selected' : ''}>${esc(f.n)} (${ens(S.conc[f.id] || 0)})</option>`).join('')}</select></label><label>Cantidad de sacos (60 lb c/u)<input id=k type=number inputmode=decimal step=0.5 min=0 required></label><button class=big>Guardar alimentación</button></form>` : '<div class="al wa">Aún no hay fórmulas. Créalas en Inventario.</div>');
                return t + `<form onsubmit="return fPes(event)">${fdIn()}<label>Lote<select id=l>${opL(pre)}</select></label><label>Peso promedio (lb)<input id=p type=number inputmode=decimal step=any min=0 required></label><button class=big>Guardar pesaje</button></form>`
            },
            inventario() {
                return `<h1>Inventario</h1><h2>Lotes</h2>${S.lotes.map(l => { const i = lInfo(l), a = pesL(l.id), g = i.gdp ?? gdp(l.id), cerr = !(l.c > 0); return `<div class=lote><b>${esc(l.n)}</b>${cerr ? ' · Cerrado' : ''}<div>${l.c} animales${i.cIn ? ' (ingresaron ' + i.cIn + ')' : ''}${i.avgIn ? ' · Peso prom. entrada: ' + i.avgIn.toFixed(1) + ' lb' : a.length ? ' · Peso prom.: ' + a.at(-1).p + ' lb' : ''}${g != null ? ' · Ganancia: ' + g.toFixed(2) + ' lb/día' : ''}</div>${l.costo ? `<div>Pagado: ${mo(l.costo)}${i.cIn ? ' · ' + mo(l.costo / i.cIn) + ' por animal' : ''}</div>` : ''}${i.cE || i.cM ? `<div>${i.cE ? 'Embarcados: ' + i.cE : ''}${i.cE && i.cM ? ' · ' : ''}${i.cM ? 'Bajas por muerte: ' + i.cM + ' (' + i.mort.toFixed(1) + '%)' : ''}</div>` : ''}${accL == l.id ? accForm(l) : `<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class=sm onclick="accL='${l.id}';accT='ing';render()">Agregar ingreso</button>${cerr ? '' : `<button class=sm onclick="accL='${l.id}';accT='emb';render()">Embarque</button><button class=sm onclick="accL='${l.id}';accT='mue';render()">Baja por muerte</button>`}</div>`}${cerr ? '' : fase(l)}</div>` }).join('') || '<p class=mu>Sin lotes todavía.</p>'}
<form onsubmit="return fLote(event)">${fdIn()}<h3>Empezar nuevo lote</h3><label>Nombre del lote<input id=n placeholder="Ej. Lote C" required></label>${grupoHTML('ng', 'Pesos de cada animal (lb)', 'Precio de cada animal (B/.)', 'Total pagado (B/.)')}<p class=mu>Los animales que lleguen después se agregan al lote con "Agregar ingreso".</p><button class=sm style="margin-top:12px">Empezar lote</button></form>
<h2>Concentrado elaborado</h2>${S.formulas.map(f => `<div class="al ok"><span>${esc(f.n)}${S.cc[f.id] ? ' · ' + mo(S.cc[f.id] * SACO) + ' por saco' : ''}</span><b>${ens(S.conc[f.id] || 0)}</b></div>`).join('')}
<h2>Fórmulas (receta por barcada)</h2>${formulasHTML()}
<h2>Insumos en bodega</h2>${S.stock.map(x => x.tk ? tkCard(x) : `<div class="al ${!x.est && x.k < x.min ? 'er' : 'ok'}"><span>${esc(x.n)}${x.c ? ' · ' + mo(x.c) + '/' + uN(x) : ''}${x.est ? '<br><small>≈ Cantidad aproximada: no se descuenta todavía</small>' : ''}</span><b>${x.est ? '≈ ' : ''}${uCant(x, x.k)}</b>${uTxt(x, x.k) ? '<br><small>' + uTxt(x, x.k).trim() + '</small>' : ''}</div>`).join('') || '<p class=mu>Sin insumos registrados.</p>'}
<form onsubmit="return fStock(event)">${fdIn()}<h3>Registrar compra de insumo</h3><label>Insumo<input id=sn list=sl placeholder="Ej. Soya" required oninput="autoU('k', S.stock.find(x => x.n.toLowerCase() == this.value.trim().toLowerCase()))"><datalist id=sl>${S.stock.map(x => `<option value="${esc(x.n)}">`).join('')}</datalist></label>${uHTML('k', 'Cantidad recibida')}<label>Total pagado (B/.)<input id=tp type=number inputmode=decimal step=any min=0 value=0></label><label>Avisar si baja de (libras, o unidades/tanques si se cuenta así)<input id=m type=number inputmode=numeric min=0 value=100></label><label style="display:flex;gap:8px;align-items:center"><input id=ae type=checkbox style="width:auto"> Inventario inicial aproximado (no se descuenta todavía)</label><p class=mu>Marca esto al registrar por primera vez un insumo cuya cantidad aún no se contó exacta. Solo aplica a insumos nuevos.</p><button class=sm style="margin-top:12px">Guardar compra</button></form>
<form onsubmit="return fAjuste(event)"><h3>Ajustar por conteo físico</h3><label>Insumo<select id=aj onchange="autoU('a', S.stock.find(x => x.id == this.value))">${S.stock.map(x => `<option value="${x.id}">${esc(x.n)}</option>`).join('')}</select></label>${uHTML('a', 'Cantidad real contada')}<button class=sm style="margin-top:12px">Ajustar inventario</button></form>
${S.stock.length ? `<form onsubmit="return fPrecio(event)"><h3>Corregir precio de un insumo</h3><label>Insumo<select id=ps onchange="verPrecio()">${S.stock.map(x => `<option value="${x.id}">${esc(x.n)}</option>`).join('')}</select></label><p class=mu id=pa></p><label>Precio (B/.)<input id=pq type=number inputmode=decimal step=any min=0 required oninput="calcP()"></label><label id=pul>Precio por<select id=pu onchange="calcP()"><option value=1>Libra</option><option value=100>Quintal (100 lb)</option><option value=otra>Otra unidad (saco, paca…)</option></select></label><label id=ppl style="display:none">Peso promedio de cada una (lb)<input id=pp type=number inputmode=decimal step=any min=0 value=100 oninput="calcP()"></label><p class=mu id=pt></p><label style="display:flex;gap:8px;align-items:center"><input id=pr type=checkbox checked style="width:auto"> Recalcular también los costos ya registrados</label><button class=sm style="margin-top:12px">Guardar precio</button></form>` : ''}

        const sumN = a => a.reduce((t, n) => t + n, 0);
        const grupoHTML = (pre, pT, tT, tot) => `<label>${pT}<textarea id=${pre}ps rows=2 placeholder="Ej. 450 480 465 (opcional)" oninput="calcG('${pre}')"></textarea></label><label>Cantidad de animales<input id=${pre}c type=number inputmode=numeric min=0 oninput="calcG('${pre}')"></label><label>Peso total del grupo (lb)<input id=${pre}p type=number inputmode=decimal step=any min=0 oninput="calcG('${pre}')"></label><label>${tT}<textarea id=${pre}pr rows=2 placeholder="Ej. 450 500 480 (opcional)" oninput="calcG('${pre}')"></textarea></label><label>${tot}<input id=${pre}t type=number inputmode=decimal step=any min=0 oninput="calcG('${pre}')"></label><p class=mu>Si escribes los pesos o los precios uno por uno, la app suma y cuenta sola. Si no, llena cantidad, peso total y total.</p><p class=mu id=${pre}s></p>`;
        const leeG = pre => { const ps = nums($('#' + pre + 'ps').value), pr = nums($('#' + pre + 'pr').value); return { c: Math.round(ps.length || +$('#' + pre + 'c').value || pr.length || 0), p: ps.length ? +sumN(ps).toFixed(1) : +$('#' + pre + 'p').value || 0, t: pr.length ? +sumN(pr).toFixed(2) : +$('#' + pre + 't').value || 0 } };
        const calcG = pre => { const g = leeG(pre); $('#' + pre + 's').textContent = g.c ? g.c + ' animales' + (g.p ? ' · peso total ' + g.p + ' lb · promedio ' + (g.p / g.c).toFixed(1) + ' lb' : '') + (g.t ? ' · total ' + mo(g.t) + ' · ' + mo(g.t / g.c) + ' por animal' : '') : '' };
        const lInfo = l => {
            const ing = l.ing || [], sal = l.sal || [], emb = sal.filter(x => x.tp == 'emb'), mue = sal.filter(x => x.tp == 'mue'), cIn = sumN(ing.map(g => g.c)), pIn = sumN(ing.map(g => g.p || 0)), cE = sumN(emb.map(x => x.c)), pE = sumN(emb.map(x => x.p || 0)), vE = sumN(emb.map(x => x.v || 0)), cM = sumN(mue.map(x => x.c));
            const avgIn = cIn && pIn ? pIn / cIn : 0, fIn = cIn ? sumN(ing.map(g => new Date(g.f) * g.c)) / cIn : 0, dias = cE ? sumN(emb.map(x => (new Date(x.f) - fIn) * x.c)) / cE / 864e5 : 0, gan = cE && avgIn && pE ? pE - avgIn * cE : null;
            return { cIn, pIn, cE, pE, vE, cM, avgIn, dias, gan, gdp: gan != null && dias > 0 ? gan / cE / dias : null, mort: cIn ? cM / cIn * 100 : 0 }
        };
        const accForm = l => {
            const t = accT, tit = { ing: 'Agregar ingreso al lote', emb: 'Registrar embarque', mue: 'Registrar baja por muerte' }[t];
            const campos = t == 'mue' ? `<label>Cantidad de animales<input id=mc type=number inputmode=numeric min=1 max="${l.c}" required></label><label>Causa o nota (opcional)<input id=mn placeholder="Ej. enfermedad"></label>` : t == 'ing' ? grupoHTML('ig', 'Pesos de cada animal (lb)', 'Precio de cada animal (B/.)', 'Total pagado (B/.)') : grupoHTML('eg', 'Pesos de cada animal (lb)', 'Precio de venta de cada animal (B/.)', 'Total de la venta (B/.)');
            return `<form onsubmit="return ${t == 'ing' ? `fIng(event,'${l.id}')` : `fSal(event,'${l.id}','${t}')`}"><h3>${tit}</h3>${fdIn('fda')}${campos}<button class=sm style="margin-top:12px">Guardar</button> <button type=button class=sm onclick="accL='';accT='';render()">Cancelar</button></form>`
        };
        function fIng(e, id) {
            e.preventDefault(); const l = S.lotes.find(x => x.id == id), g = leeG('ig'); if (!(g.c > 0)) { toast('Escribe cuántos animales entraron', 1); return false }
            (l.ing = l.ing || []).push({ id: uid(), f: fdv('fda'), c: g.c, p: g.p, costo: g.t }); l.c += g.c; l.costo = +((l.costo || 0) + g.t).toFixed(2); accL = ''; accT = ''; save(); toast('✔ Ingreso guardado'); render(); return false
        }
        function fSal(e, id, tp) {
            e.preventDefault(); const l = S.lotes.find(x => x.id == id), f = fdv('fda'); let c, p = 0, v = 0, nota = '';
            if (tp == 'mue') { c = Math.round(+$('#mc').value || 0); nota = $('#mn').value.trim() } else { const g = leeG('eg'); c = g.c; p = g.p; v = g.t }
            if (!(c > 0) || c > l.c) { toast('Cantidad no válida: el lote tiene ' + l.c + ' animales', 1); return false }
            (l.sal = l.sal || []).push({ id: uid(), f, tp, c, p, v, nota }); l.c -= c; accL = ''; accT = ''; save(); toast(tp == 'mue' ? '✔ Baja guardada' : '✔ Embarque guardado' + (l.c == 0 ? ' · lote cerrado' : '')); render(); return false
        }
        function fStock(e) {
            e.preventDefault(); const n = $('#sn').value.trim(), k = lbX('k'), tp = +$('#tp').value || 0, x = S.stock.find(s => s.n.toLowerCase() == n.toLowerCase());
            let t = 'insumo'; if (x && !unidadOk(x, 'k')) return false;
            if ($('#ku').value == 'tk') {
                const q = +$('#kq').value || 0, lbs = +$('#kl').value || 0, precio = lbs > 0 && tp > 0;
                if (x) { x.tn = (x.tn || 0) + q; if (precio) x.c = +(tp / lbs).toFixed(4); x.min = +$('#m').value }
                else { if ($('#ae').checked) t = 'inicial'; S.stock.push({ id: uid(), n, k: 0, c: precio ? +(tp / lbs).toFixed(4) : 0, min: +$('#m').value, est: false, tk: true, tn: q, tev: [], cons: 0, cons0: 0 }) }
                S.compras.push({ id: uid(), f: fdv(), t, ref: n, lb: q, total: tp }); const y = S.stock.find(s => s.n.toLowerCase() == n.toLowerCase()); save(); toast(y.c ? '✔ Guardado' : '✔ Guardado. Falta el precio por lb: usa "Corregir precio de un insumo"'); render(); return false
            }
            if (x) guardaU(x, 'k');
            if (x && x.est) { if (k > 0 && tp > 0) x.c = +(tp / k).toFixed(4); x.min = +$('#m').value }
            else if (x) { x.c = x.k + k > 0 ? +(((x.k * (x.c || 0)) + tp) / (x.k + k)).toFixed(4) : 0; x.k = +(x.k + k).toFixed(2); x.min = +$('#m').value }
            else { const est = $('#ae').checked; if (est) t = 'inicial'; S.stock.push({ id: uid(), n, k, c: k > 0 ? +(tp / k).toFixed(4) : 0, min: +$('#m').value, est }); guardaU(S.stock.at(-1), 'k') }
            S.compras.push({ id: uid(), f: fdv(), t, ref: n, lb: k, total: tp }); save(); toast(x && x.est ? '✔ Compra guardada (se sumará al activar el descuento)' : '✔ Guardado'); render(); return false
        }
        const lbP = () => { const u = $('#pu').value, q = +$('#pq').value || 0; const x = S.stock.find(s => s.id == $('#ps').value); if (x?.cnt) return q; return u == 'otra' ? q / (+$('#pp').value || 1) : q / +u };
        function calcP() { $('#ppl').style.display = $('#pu').value == 'otra' ? '' : 'none'; const x = S.stock.find(s => s.id == $('#ps').value); $('#pt').textContent = x?.cnt ? '' : '= ' + mo(lbP()) + ' por lb' }
        function verPrecio() { const x = S.stock.find(s => s.id == $('#ps').value); if ($('#pa')) { $('#pa').textContent = x ? (x.cnt ? 'Precio actual: ' + mo(x.c || 0) + ' por ' + x.ud : 'Precio actual: ' + mo(x.c || 0) + ' por lb (' + mo((x.c || 0) * 100) + ' por quintal)') : ''; $('#pul').style.display = x?.cnt ? 'none' : ''; $('#ppl').style.display = 'none'; calcP() } }
        function recalcCostos() {
            S.elab.forEach(r => (r.ins || []).forEach(u => { if (u.c == null) u.c = S.stock.find(x => x.id == u.i)?.c || 0 }));
            S.formulas.forEach(f => {
                const evs = [...S.elab.filter(r => r.fo == f.id).map(r => ({ e: 1, f: r.f, r })), ...S.ali.filter(a => a.fo == f.id).map(a => ({ e: 0, f: a.f, r: a }))].sort((x, y) => x.f < y.f ? -1 : x.f > y.f ? 1 : y.e - x.e);
                let lb = 0, cs = 0, cc = S.cc[f.id] || 0;
                evs.forEach(v => { if (v.e) { v.r.costo = +(v.r.ins || []).reduce((t, u) => t + u.q * (u.c || 0), 0).toFixed(2); lb += v.r.out; cs += v.r.costo; cc = lb > 0 ? cs / lb : cc } else { v.r.cs = +(v.r.k * cc).toFixed(2); lb -= v.r.k; cs -= v.r.k * cc } });
                if (evs.length) S.cc[f.id] = +cc.toFixed(4)
            })
        }
        function fPrecio(e) {
            e.preventDefault(); const x = S.stock.find(s => s.id == $('#ps').value), c = +lbP().toFixed(4); if (!x) return false;
            x.c = c; if ($('#pr').checked) { S.elab.forEach(r => (r.ins || []).forEach(u => { if (u.i == x.id) u.c = c })); recalcCostos() }
            save(); toast('✔ Precio de ' + x.n + ': ' + mo(c) + ' por ' + uN(x)); render(); return false
        }
        function tanqueVacio(id) {
            const x = S.stock.find(s => s.id == id); if (!x || !(x.tn > 0)) { toast('No hay tanques registrados', 1); return }
            if (!confirm('¿Se vació un tanque de ' + x.n + '?')) return;
            const lb = +((x.cons || 0) - (x.cons0 || 0)).toFixed(1); x.cons0 = x.cons || 0; x.tn--; (x.tev = x.tev || []).push({ f: hoy(), lb });
            S.compras.push({ id: uid(), f: hoy(), t: 'tanque', ref: x.n, lb: -1, total: 0, uso: lb }); save(); toast('✔ Tanque vaciado' + (lb > 0 ? ' · se usaron ≈ ' + lb + ' lb' : '')); render()
        }
        function fActivar(e) {
            e.preventDefault(); const x = S.stock.find(s => s.id == $('#xs').value), r = lbX('x'), d = $('#xf').value || hoy(); if (!x) return false; if (!unidadOk(x, 'x')) return false; guardaU(x, 'x');
            const gastado = S.elab.filter(a => a.f > d).reduce((t, a) => t + (a.ins || []).filter(u => u.i == x.id).reduce((q, u) => q + u.q, 0), 0), compradas = S.compras.filter(c => c.t == 'insumo' && c.ref == x.n && c.f > d).reduce((t, c) => t + c.lb, 0), nuevo = +(r - gastado + compradas).toFixed(2);
            if (nuevo < 0) { toast('El conteo no cubre lo consumido desde esa fecha. Revisa la fecha o la cantidad', 1); return false }
            S.compras.push({ id: uid(), f: hoy(), t: 'ajuste', ref: x.n, lb: +(nuevo - x.k).toFixed(2), total: 0 }); x.k = nuevo; x.est = false; save(); toast('✔ Descuento activado: ' + nuevo + ' lb'); render(); return false
        }
        function fAjuste(e) {
            e.preventDefault(); const x = S.stock.find(s => s.id == $('#aj').value), r = lbX('a'); if (!x) return false; if (x.tk) { const q = +$('#aq').value || 0; S.compras.push({ id: uid(), f: hoy(), t: 'ajuste', ref: x.n, lb: +(q - (x.tn || 0)).toFixed(2), total: 0 }); x.tn = q; save(); toast('✔ Tanques ajustados: ' + q); render(); return false } if (!unidadOk(x, 'a')) return false; guardaU(x, 'a');
            S.compras.push({ id: uid(), f: hoy(), t: 'ajuste', ref: x.n, lb: +(r - x.k).toFixed(2), total: 0 }); x.k = r; save(); toast('✔ Inventario ajustado'); render(); return false
        }
        function borrarTodo() { if (prompt('Esto borra TODOS los datos de la app. Escribe BORRAR para confirmar.') !== 'BORRAR') return; S = vacioS(); save(); render(); toast('Datos borrados') }
        function formulasHTML() {
            return S.formulas.map(f => {
                const det = f.ing.map(g => { const s = S.stock.find(x => x.id == g.i); return s ? esc(s.n) + ': ' + (s.ud && s.pu ? +(g.q / s.pu).toFixed(2) + ' ' + esc(s.ud) : g.q + ' lb') : '' }).filter(Boolean).join(' · ') || 'Sin insumos';
                if (editF != f.id) return `<div class=lote><b>${esc(f.n)}</b><div>${det}</div><button class=sm style="margin-top:8px" onclick="editF='${f.id}';render()">Editar</button></div>`;
                return `<div class=lote><form onsubmit="return fForm(event,'${f.id}')"><label>Nombre<input id=fn value="${esc(f.n)}" required></label><p class=mu>Cantidad de cada insumo por barcada, en la unidad que se indica (vacío o 0 si no se usa):</p>${S.stock.map(s => { const g = f.ing.find(x => x.i == s.id); return `<label>${esc(s.n)} (${s.ud && s.pu ? esc(s.ud) : 'lb'})<input class=fi data-i="${s.id}" data-p="${s.ud && s.pu ? s.pu : 1}" type=number inputmode=decimal step=any min=0 value="${g ? (s.ud && s.pu ? +(g.q / s.pu).toFixed(2) : g.q) : ''}"></label>` }).join('')}<button class=sm style="margin-top:12px">Guardar fórmula</button> <button type=button class=sm onclick="editF='';render()">Cancelar</button></form></div>`
            }).join('')
        }
        function fForm(e, id) {
            e.preventDefault(); const f = S.formulas.find(x => x.id == id); f.n = $('#fn').value.trim() || f.n;
            f.ing = [...document.querySelectorAll('.fi')].map(i => ({ i: i.dataset.i, q: +((+i.value || 0) * (+i.dataset.p || 1)).toFixed(2) })).filter(g => g.q > 0);
            editF = ''; save(); toast('✔ Fórmula guardada'); render(); return false
        }
        function csv() { const r = [['fecha', 'hora', 'lote', 'alimento', 'lb'], ...S.ali.map(a => [a.f, a.t, S.lotes.find(l => l.id == a.l)?.n || '', a.a, a.k])]; const u = URL.createObjectURL(new Blob([r.map(x => x.map(v => `"${v}"`).join(',')).join('\n')], { type: 'text/csv' })), a = document.createElement('a'); a.href = u; a.download = 'alimentacion.csv'; a.click() }
        function demo() {
            const d = n => { const x = new Date(); x.setDate(x.getDate() - n); return x.toLocaleDateString('sv') };
            S = {
                ...vacioS(), formulas: [{ id: 'f1', n: 'Fórmula 1', ing: [{ i: 's2', q: 300 }, { i: 's4', q: 30 }, { i: 's6', q: 100 }] }, { id: 'f2', n: 'Fórmula 2', ing: [{ i: 's2', q: 300 }, { i: 's4', q: 40 }, { i: 's6', q: 80 }] }, { id: 'f3', n: 'Fórmula 3', ing: [{ i: 's2', q: 300 }, { i: 's4', q: 50 }, { i: 's6', q: 60 }] }, { id: 'f4', n: 'Fórmula 4', ing: [{ i: 's2', q: 300 }, { i: 's4', q: 60 }, { i: 's6', q: 40 }] }], conc: { f1: 200, f2: 500, f3: 300, f4: 0 }, elab: [], fases: [],
                stock: [{ id: 's2', n: 'Maíz', k: 5000, min: 1500 }, { id: 's3', n: 'Sal mineral', k: 90, min: 100 }, { id: 's4', n: 'Soya', k: 800, min: 250 }, { id: 's5', n: 'Melaza', k: 650, min: 220 }, { id: 's6', n: 'Paca', k: 3000, min: 800 }], lotes: [{ id: 'l1', n: 'Lote A', c: 24, fo: 'f2' }, { id: 'l2', n: 'Lote B', c: 18, fo: 'f1' }],
                pes: [{ id: 'p1', f: d(14), l: 'l1', p: 685 }, { id: 'p2', f: d(0), l: 'l1', p: 725 }, { id: 'p3', f: d(14), l: 'l2', p: 630 }, { id: 'p4', f: d(0), l: 'l2', p: 665 }],
                ali: [{ id: 'a1', f: d(1), t: '07:30', l: 'l1', a: 'Fórmula 2', fo: 'f2', k: 180 }, { id: 'a2', f: d(1), t: '07:50', l: 'l2', a: 'Fórmula 1', fo: 'f1', k: 120 }]
            }; save(); render()
        }
        addEventListener('online', render); addEventListener('offline', render);
        if ('serviceWorker' in navigator && location.protocol != 'file:') navigator.serviceWorker.register('sw.js');
        render();
    </script>
